[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elp"
version = "0.2.0"
description = "Evolving Loop Programs: Discovering How Frozen Transformers Should Loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
]

[project.scripts]
elp = "elp.cli:main"

[project.optional-dependencies]
image = ["pillow>=10.0"]
text = ["transformers>=4.40", "accelerate>=0.30", "safetensors>=0.4"]
video = ["diffusers>=0.31", "transformers>=4.40", "accelerate>=0.30"]
dev = ["pytest>=8.0"]
all = [
  "pillow>=10.0",
  "transformers>=4.40",
  "diffusers>=0.31",
  "accelerate>=0.30",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["elp*"]
